# Version-generic Moodle dev environment for the Vektra assessment bot (plan assess-moodle-ws,
# group A). One file, one env file per Moodle version:
#
#   docker compose -f compose.moodle.yml --env-file env.43 up -d --build   # Moodle 4.3
#   docker compose -f compose.moodle.yml --env-file env.52 up -d --build   # Moodle 5.2
#
# (or `make moodle43-up` / `make moodle52-up` in this directory). Each env file sets its own
# COMPOSE_PROJECT_NAME, so containers, volumes and loopback ports never collide with each
# other or with docker-compose.yml (Moodle 5.1). Dev only: credentials are local defaults.
name: ${COMPOSE_PROJECT_NAME}

services:
  mariadb:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MARIADB_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  moodle:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION}
        MOODLE_TGZ_URL: ${MOODLE_TGZ_URL}
        MOODLE_TGZ_SHA256: ${MOODLE_TGZ_SHA256}
        MOODLE_DOCROOT: ${MOODLE_DOCROOT}
    image: ${COMPOSE_PROJECT_NAME}-moodle
    container_name: ${COMPOSE_PROJECT_NAME}
    ports:
      - "127.0.0.1:${MOODLE_PORT}:80"
    environment:
      MOODLE_URL: ${MOODLE_URL}
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      N8N_WS_TOKEN: "${N8N_WS_TOKEN:-}"
      ASSESS_WS_TOKEN: "${ASSESS_WS_TOKEN:-}"
    volumes:
      - moodle_data:/var/moodledata
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      # the block plugin follows the web docroot: public/blocks in 5.x, blocks in 4.x
      - ../:${MOODLE_DOCROOT}/blocks/vektra:ro
      - ./provision:/opt/vektra/provision:ro
      - ./fixtures:/opt/vektra/fixtures
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  moodle_data:
