name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: PHP Syntax & Moodle Code Style
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: cs2pr

      - name: PHP syntax check
        run: find . -name '*.php' -not -path './vendor/*' | xargs -n1 php -l

      - name: Install Moodle Code Checker
        run: |
          composer create-project moodlehq/moodle-cs moodle-cs --no-interaction
          cd moodle-cs && composer install --no-interaction

      - name: Run phpcs with Moodle standard
        run: |
          set -o pipefail
          ./moodle-cs/vendor/bin/phpcs \
            --standard=moodle \
            --extensions=php \
            --ignore=vendor,moodle-cs \
            --report=checkstyle \
            . | cs2pr

  release-zip:
    name: Validate release zip structure
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same command as release.yml: tracked files only, .gitattributes export-ignore applied.
      - name: Build zip
        run: git archive --format=zip --prefix=vektra/ -o "$RUNNER_TEMP/vektra.zip" HEAD

      - name: Validate zip content
        run: bash ./.github/scripts/assert-release-zip.sh "$RUNNER_TEMP/vektra.zip" vektra
