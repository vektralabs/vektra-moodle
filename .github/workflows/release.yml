name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create release with zip
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tracked files only (an untracked file can never leak); .gitattributes export-ignore drops
      # docker/, n8n/, .s2s/, .claude/, .github/ and the local notes.
      - name: Build Moodle plugin zip
        run: git archive --format=zip --prefix=vektra/ -o "$RUNNER_TEMP/vektra.zip" HEAD

      - name: Validate zip content
        run: ./.github/scripts/assert-release-zip.sh "$RUNNER_TEMP/vektra.zip" vektra

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/vektra.zip
          generate_release_notes: true
