services:
  n8n:
    image: n8nio/n8n:2.17.2
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,http,https,url
      - NODE_FUNCTION_ALLOW_EXTERNAL=
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Rome}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_TASK_TIMEOUT=900
      - MOODLE_URL=${MOODLE_URL:-http://vektra-moodle}
      - MOODLE_WS_TOKEN=${MOODLE_WS_TOKEN}
      - VEKTRA_API_URL=${VEKTRA_API_URL:-http://vektra-stack-vektra-1:8000}
      - VEKTRA_API_KEY=${VEKTRA_API_KEY}
      - INGEST_CRON=${INGEST_CRON:-*/5 * * * *}
      - DELETION_SAFETY_THRESHOLD=${DELETION_SAFETY_THRESHOLD:-3}
      - INGEST_OPT_OUT_TAG=${INGEST_OPT_OUT_TAG:-[no-ai]}
      # Instance identity, read by the workflow's Config node. The main instance
      # keeps a default so it works out of the box; a second instance must declare
      # its own, because the Config node refuses to run without a state path
      # rather than fall back to a shared file and delete another instance's
      # documents. Distinct names are required: n8n env is per-process.
      - STATE_FILE_PATH=${STATE_FILE_PATH:-/home/node/.n8n/moodle-ingest-state.json}
      - MOOC_MOODLE_URL=${MOOC_MOODLE_URL:-}
      - MOOC_MOODLE_WS_TOKEN=${MOOC_MOODLE_WS_TOKEN:-}
      - MOOC_STATE_FILE_PATH=${MOOC_STATE_FILE_PATH:-}
      - YTDLP_API_URL=${YTDLP_API_URL:-http://ytdlp-api:8000}
      - YTDLP_API_KEY=${YTDLP_API_KEY}
      - YTDLP_TRANSCRIPT_LANG=${YTDLP_TRANSCRIPT_LANG:-it}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - vektra_stack
      - moodle

  ytdlp-api:
    image: ghcr.io/fvadicamo/yt-dlp-api:weekly
    restart: unless-stopped
    environment:
      # The app parses this as a JSON list, not a bare string. Compose has no
      # escaping, so the value is interpolated raw: a key containing a double
      # quote or a backslash produces invalid JSON and the service exits at
      # startup. Keep YTDLP_API_KEY to [A-Za-z0-9_-] — see n8n/.env.example.
      - 'APP_SECURITY_API_KEYS=["${YTDLP_API_KEY}"]'
      # Startup validation disables the whole YouTube provider when no cookie
      # path is set, even though public-video transcripts need no auth. See
      # n8n/README.md — a non-authenticating placeholder file satisfies it.
      - APP_YOUTUBE_COOKIE_PATH=/app/cookies/youtube.txt
    volumes:
      - ./cookies:/app/cookies:ro
    networks:
      - default

volumes:
  n8n_data:

networks:
  default:
    name: n8n_default
  vektra_stack:
    name: ${VEKTRA_STACK_NETWORK:-vektra-stack_default}
    external: true
  moodle:
    name: ${MOODLE_NETWORK:-docker_default}
    external: true
